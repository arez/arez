name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Check
        run: tools/check.sh
      - name: Retain coverage and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            reports/coverage
            reports/verification
          if-no-files-found: warn
