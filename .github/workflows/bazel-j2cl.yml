name: Bazel J2CL

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          bundler: '2.3.7'
          bundler-cache: true
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Verify Bazel version
        run: test "$(bazel --version)" = "bazel 9.3.0"
      - name: Run JVM tests
        run: bundle exec buildr test GWT=no BUILD_STATS=no
      - name: Compile J2CL applications
        run: bundle exec buildr arez:extras:promise:bazel_j2cl_test arez:extras:spytools:bazel_j2cl_test GWT=no BUILD_STATS=no
